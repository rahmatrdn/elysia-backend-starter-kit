info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "john.doe@example.com",
        "password": "secretpassword",
        "role_access": 3123
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
